name: Update catalogs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-catalogs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install "tq-json[cli]"

      - name: Build catalogs
        run: bash scripts/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(date -u +%Y-%m-%d)"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" \
              catalog.json \
              catalog.full.json \
              --clobber
          else
            gh release create "$tag" \
              catalog.json \
              catalog.full.json \
              --title "$tag" \
              --notes "Model catalog snapshot for $tag." \
              --target "$GITHUB_SHA" \
              --latest
          fi
